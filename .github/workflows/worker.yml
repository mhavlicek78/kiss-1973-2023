name: Nasazení synchronizace sbírky
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nasadit Worker
        id: wr
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Adresa
        run: |
          echo "URL=${{ steps.wr.outputs.deployment-url }}"
          echo "Worker ${{ steps.wr.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
